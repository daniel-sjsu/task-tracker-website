<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Tracker Pro</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{font-family:Arial,sans-serif;max-width:1200px;margin:auto;padding:20px;background:#f4f4f4}
.card{background:white;padding:16px;border-radius:10px;margin:12px 0;box-shadow:0 2px 6px rgba(0,0,0,.1)}
input,button{padding:8px;margin:4px}
.task{border-left:6px solid #ccc}
.running{border-left-color:green}
.completed{opacity:0.6}
.progress{height:18px;background:#ddd;border-radius:8px;overflow:hidden}
.bar{height:100%;background:green}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.small{color:#666;font-size:.9em}
</style>

</head>
<body>

<h1>Time Tracker Pro</h1>

<div class="card">
<input id="name" placeholder="Task name">
<input id="goal" type="number" step="0.25" placeholder="Target hours">
<button onclick="addTask()">Add Task</button>
<button onclick="exportCSV()">Export Sessions CSV</button>
</div>

<div id="dashboard" class="grid"></div>

<div class="card">
<h3>Today's Distribution</h3>
<canvas id="pie"></canvas>
</div>

<div class="card">
<h3>Weekly Productivity</h3>
<canvas id="weekly"></canvas>
</div>

<h2>Active Tasks</h2>
<div id="tasks"></div>

<div class="card">
  <h2 onclick="toggleCompleted()" style="cursor:pointer; user-select:none;">
    Completed Tasks ▼
  </h2>

  <div id="completedTasks" style="display:none;"></div>
</div>
<div class="card">
<h2>Today's Session History</h2>
<div id="history"></div>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
let sessions = JSON.parse(localStorage.getItem('sessions') || '[]');
let state = JSON.parse(localStorage.getItem('state') || '{"runningTaskId":null,"startTime":null}');

let pieChart = null;
let weeklyChart = null;

/* ---------------- SAVE ---------------- */
function save(){
 localStorage.setItem('tasks', JSON.stringify(tasks));
 localStorage.setItem('sessions', JSON.stringify(sessions));
 localStorage.setItem('state', JSON.stringify(state));
}

/* ---------------- TASKS ---------------- */
function addTask(){
 const n = document.getElementById('name').value.trim();
 const g = parseFloat(document.getElementById('goal').value);
 if(!n || !g) return;

 tasks.push({
   id: Date.now(),
   name: n,
   goal: g,
   total: 0,
   completed: false,
   completedAt: null
 });

 document.getElementById('name').value = '';
 document.getElementById('goal').value = '';
 save(); render();
}

function delTask(id){
 tasks = tasks.filter(t => t.id !== id);
 save(); render();
}

function completeTask(id){
 const task = tasks.find(t => t.id === id);
 if(!task) return;

 if(state.runningTaskId === id){
   stopTask();
 }

 task.completed = true;
 task.completedAt = Date.now();

 save(); render();
}
function toggleCompleted(){
 const div = document.getElementById('completedTasks');

 if(div.style.display === 'none'){
   div.style.display = 'block';
 } else {
   div.style.display = 'none';
 }
}

function restoreTask(id){
 const task = tasks.find(t => t.id === id);

 if(task){
   task.completed = false;
   task.completedAt = null;
 }

 save();
 render();
}
/* ---------------- TIMER ---------------- */
function startTask(id){
 if(state.runningTaskId) stopTask();
 state.runningTaskId = id;
 state.startTime = Date.now();
 save(); render();
}

function stopTask(){
 if(!state.runningTaskId) return;

 let dur = (Date.now() - state.startTime) / 1000;
 let task = tasks.find(x => x.id === state.runningTaskId);

 if(task){
   task.total += dur;

   sessions.push({
     taskId: task.id,
     taskName: task.name,
     start: state.startTime,
     end: Date.now(),
     duration: dur
   });
 }

 state.runningTaskId = null;
 state.startTime = null;

 save(); render();
}

/* ---------------- HELPERS ---------------- */
function fmt(sec){
 sec = Math.floor(sec);
 let h = Math.floor(sec / 3600);
 let m = Math.floor((sec % 3600) / 60);
 return `${h}h ${m}m`;
}

function currentSeconds(t){
 let s = t.total;
 if(state.runningTaskId === t.id){
   s += (Date.now() - state.startTime) / 1000;
 }
 return s;
}

function todaySessions(){
 let d = new Date();
 d.setHours(0,0,0,0);
 return sessions.filter(s => s.start >= d.getTime());
}

/* ---------------- DASHBOARD ---------------- */
function renderDashboard(){

const today = todaySessions();

const todayHours =
  today.reduce((a,b)=>a+b.duration,0)/3600;

const weekHours =
  sessions
    .filter(s =>
      s.start >= Date.now() - 7*24*60*60*1000
    )
    .reduce((a,b)=>a+b.duration,0)/3600;

const goalHours =
  tasks
    .filter(t => !t.completed)
    .reduce((a,b)=>a+b.goal,0);

const completed =
  tasks.filter(t => t.completed).length;

const completionRate =
  tasks.length
  ? (completed/tasks.length)*100
  : 0;

document.getElementById('dashboard').innerHTML = `
<div class="card">
  <b>Today</b><br>
  ${todayHours.toFixed(2)} h
</div>

<div class="card">
  <b>This Week</b><br>
  ${weekHours.toFixed(2)} h
</div>

<div class="card">
  <b>Remaining Planned</b><br>
  ${goalHours.toFixed(2)} h
</div>

<div class="card">
  <b>Completed Tasks</b><br>
  ${completed}/${tasks.length}
  (${completionRate.toFixed(1)}%)
</div>

<div class="card">
  <b>Running</b><br>
  ${
    state.runningTaskId
      ? (tasks.find(t => t.id === state.runningTaskId)?.name || '')
      : 'None'
  }
</div>`;
}



/* ---------------- HISTORY ---------------- */
function renderHistory(){
 const today = todaySessions().reverse();
 document.getElementById('history').innerHTML =
 today.length
 ? today.map(s =>
   `<div>${new Date(s.start).toLocaleTimeString()} - ${s.taskName} (${fmt(s.duration)})</div>`
 ).join('')
 : "No sessions today";
}

/* ---------------- PIE CHART ---------------- */
function renderPie(){
 let totals = {};
 todaySessions().forEach(s=>{
   totals[s.taskName] = (totals[s.taskName] || 0) + s.duration/3600;
 });

 const labels = Object.keys(totals);
 const data = Object.values(totals);

 if(pieChart) pieChart.destroy();

 pieChart = new Chart(document.getElementById('pie'), {
   type:'pie',
   data:{ labels, datasets:[{ data }] }
 });
}

/* ---------------- WEEKLY CHART ---------------- */
function getLast7Days(){
 let days = [];
 for(let i=6;i>=0;i--){
   let d = new Date();
   d.setDate(d.getDate()-i);
   d.setHours(0,0,0,0);
   days.push(d);
 }
 return days;
}

function renderWeekly(){
 const days = getLast7Days();

 const labels = days.map(d =>
   d.toLocaleDateString(undefined,{weekday:'short'})
 );

 const data = days.map(d=>{
   let next = new Date(d);
   next.setDate(d.getDate()+1);

   return sessions
     .filter(s => s.start >= d.getTime() && s.start < next.getTime())
     .reduce((a,b)=>a+b.duration,0)/3600;
 });

 if(weeklyChart) weeklyChart.destroy();

 weeklyChart = new Chart(document.getElementById('weekly'), {
   type:'bar',
   data:{
     labels,
     datasets:[{ label:'Hours', data }]
   }
 });
}

/* ---------------- TASK RENDER ---------------- */
function renderTasks(){

const activeDiv = document.getElementById('tasks');
const completedDiv = document.getElementById('completedTasks');

activeDiv.innerHTML = '';
completedDiv.innerHTML = '';

tasks.forEach(t => {

  const sec = currentSeconds(t);
  const goal = t.goal * 3600;
  const pct = (sec / goal) * 100;
  const diff = (sec - goal) / 3600;

  const div = document.createElement('div');

  div.className =
    `card task
     ${state.runningTaskId===t.id?'running':''}
     ${t.completed?'completed':''}`;

  div.innerHTML = `
  <h3>${t.name}</h3>

  <div>Goal: ${t.goal.toFixed(2)} h</div>

  <div>Tracked: ${fmt(sec)}</div>

  <div>
  ${
    diff >= 0
    ? 'Overrun: +' + diff.toFixed(2) + ' h'
    : 'Remaining: ' + Math.abs(diff).toFixed(2) + ' h'
  }
  </div>

  <div>${pct.toFixed(1)}%</div>

  <div class="progress">
     <div class="bar"
     style="width:${Math.min(pct,100)}%">
     </div>
  </div>

  ${
    t.completedAt
    ? `<div class="small">
         Completed:
         ${new Date(t.completedAt).toLocaleDateString()}
       </div>`
    : ''
  }

  <br>

  ${
    !t.completed
    ? (
       state.runningTaskId===t.id
       ? '<button onclick="stopTask()">Stop</button>'
       : `<button onclick="startTask(${t.id})">Start</button>`
      )
    : ''
  }

  ${
    !t.completed
    ? `<button onclick="completeTask(${t.id})">Complete</button>`
    : `<button onclick="restoreTask(${t.id})">Restore</button>`
  }

  <button onclick="delTask(${t.id})">Delete</button>
  `;

  if(t.completed){
     completedDiv.appendChild(div);
  } else {
     activeDiv.appendChild(div);
  }

});

}

/* ---------------- EXPORT ---------------- */
function exportCSV(){
 let csv = "Task,Start,End,Hours\n";

 sessions.forEach(s=>{
   csv += `${s.taskName},"${new Date(s.start).toISOString()}","${new Date(s.end).toISOString()}",${(s.duration/3600).toFixed(2)}\n`;
 });

 const blob = new Blob([csv], {type:'text/csv'});
 const a = document.createElement('a');
 a.href = URL.createObjectURL(blob);
 a.download = 'sessions.csv';
 a.click();
}

/* ---------------- MAIN RENDER ---------------- */
function render(){
 save();
 renderDashboard();
 renderTasks();
 renderHistory();
 renderPie();
 renderWeekly();
}

/* live update */
setInterval(() => {
 renderDashboard();
 renderTasks();
}, 1000);

render();
</script>

</body>
</html>
